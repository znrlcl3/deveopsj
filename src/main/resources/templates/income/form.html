<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>수입 등록 | AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Pretendard', sans-serif; }
        .form-container { max-width: 600px; margin: 60px auto; }
        .card { border: none; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .btn-save { background: #36b9cc; color: white; border: none; padding: 12px; font-weight: 600; }
    </style>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{common/navigation :: sidebar('income')}"></div>
    <main class="flex-grow-1" style="margin-left: 280px; min-height: 100vh;">
        <div class="container form-container">
            <h3 class="fw-bold mb-4">수입 등록</h3>
            <ul class="nav nav-tabs mb-4">
                <li class="nav-item"><a class="nav-link active" href="/income/form">수입 등록</a></li>
                <li class="nav-item"><a class="nav-link" href="/income/list">수입 내역</a></li>
            </ul>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="card p-4">
                <div class="card-body">
                    <p class="text-muted small">
                        월급, 부수입, 배당, 이자처럼 새로 들어온 돈을 기록합니다.
                        내 계좌 간 이체와 주식 매도대금은 수입으로 등록하지 않습니다.
                    </p>
                    <form action="/income/save" method="post" class="income-amount-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-4">
                            <label class="form-label fw-bold">수입일</label>
                            <input type="date" name="incomeDate"
                                   class="form-control form-control-lg border-0 bg-light"
                                   th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">수입 유형</label>
                            <select name="incomeType"
                                    class="form-select form-select-lg border-0 bg-light" required>
                                <option value="">유형을 선택하세요</option>
                                <option th:each="type : ${incomeTypes}"
                                        th:value="${type.name()}" th:text="${type.label}"></option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">수입금액</label>
                            <input type="text" name="amount" inputmode="numeric"
                                   class="form-control form-control-lg border-0 bg-light amount-input"
                                   pattern="[0-9,]+" placeholder="0" autocomplete="off" required>
                        </div>
                        <div class="mb-5">
                            <label class="form-label fw-bold">메모</label>
                            <input type="text" name="memo"
                                   class="form-control form-control-lg border-0 bg-light"
                                   maxlength="200" placeholder="예: 7월 급여">
                        </div>
                        <button type="submit" class="btn btn-save w-100 rounded-pill shadow-sm">
                            수입 저장
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="/js/common.js"></script>
<script>
    document.querySelectorAll('.income-amount-form').forEach(form => {
        const input = form.querySelector('.amount-input');
        input.addEventListener('input', () => formatNumberInput(input));
        form.addEventListener('submit', () => input.value = input.value.replace(/,/g, ''));
    });
</script>
</body>
</html>
