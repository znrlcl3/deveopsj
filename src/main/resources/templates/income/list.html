<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/income.css">
    <title>수입 내역 | AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Pretendard', sans-serif; }
        .content-container { max-width: 1100px; margin: 28px auto; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="income-page">
<div class="d-flex">
    <div th:replace="~{common/navigation :: sidebar('income')}"></div>
    <main class="income-main">
        <div class="container content-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <h3 class="fw-bold mb-0">수입 내역</h3>
                <a href="/income/form" class="btn btn-primary">
                    <i class="fas fa-plus me-1"></i> 새 수입 등록
                </a>
            </div>
            <ul class="nav nav-tabs mb-4">
                <li class="nav-item"><a class="nav-link" href="/income/form">수입 등록</a></li>
                <li class="nav-item"><a class="nav-link active" href="/income/list">수입 내역</a></li>
            </ul>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div class="income-exports"><div th:replace="~{common/excel-export :: controls('/income/export', ${selectedMonth}, 'incomeExportModal')}"></div></div>

            <div class="card p-4 mb-4">
                <form action="/income/list" method="get" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="month" class="form-label fw-bold">조회 월</label>
                        <input id="month" type="month" name="month" class="form-control"
                               th:value="${selectedMonth}" min="1900-01" max="9999-12" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-outline-primary w-100">조회</button>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <span class="text-muted">월 수입 합계</span>
                        <strong class="fs-4 ms-2"
                                th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + '원'"></strong>
                    </div>
                </form>
                <nav class="d-flex flex-wrap gap-2 mt-3" aria-label="수입 조회 월 이동">
                    <a th:if="${previousMonth != null}" th:href="@{/income/list(month=${previousMonth})}" class="btn btn-sm btn-outline-secondary">← 이전 달</a>
                    <a href="/income/list" class="btn btn-sm btn-outline-secondary">이번 달</a>
                    <a th:if="${nextMonth != null}" th:href="@{/income/list(month=${nextMonth})}" class="btn btn-sm btn-outline-secondary">다음 달 →</a>
                    <span class="small text-muted align-self-center" th:text="|${incomeCount}건의 수입 기록|"></span>
                </nav>
            </div>
            <section class="mb-4" aria-labelledby="incomeBreakdown">
                <h4 id="incomeBreakdown" class="h6 fw-bold">유형별 수입</h4>
                <div class="row g-2">
                    <div class="col-6 col-lg" th:each="type : ${incomeTypes}"><div class="card p-3 h-100">
                        <span class="small text-muted" th:text="${type.label}"></span>
                        <strong class="income-value" th:text="${#numbers.formatInteger(totalsByType.get(type), 0, 'COMMA')} + '원'"></strong>
                    </div></div>
                </div>
            </section>

            <div class="card p-4">
                <p class="small text-muted d-lg-none">표를 좌우로 밀면 등록 일시와 수정·삭제 버튼을 볼 수 있습니다.</p>
                <div class="table-responsive">
                    <table class="table table-hover align-middle income-table">
                        <thead><tr><th>수입일</th><th>유형</th><th class="text-end">금액</th><th>메모</th><th>등록 일시</th><th class="text-end">관리</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(incomes)}">
                            <td colspan="6" class="text-center text-muted py-5">조회한 월의 수입 내역이 없습니다.<br><a href="/income/form" class="btn btn-outline-primary mt-3">첫 수입 등록하기</a></td>
                        </tr>
                        <tr th:each="income : ${incomes}">
                            <td th:text="${income.incomeDate}"></td>
                            <td><span class="badge text-bg-info" th:text="${income.incomeType.label}"></span></td>
                            <td class="text-end fw-bold"
                                th:text="${#numbers.formatInteger(income.amount, 0, 'COMMA')} + '원'"></td>
                            <td class="income-memo"><span th:text="${#strings.isEmpty(income.memo) ? '-' : income.memo}"></span>
                                <details th:if="${income.importKey != null}" class="small mt-2"><summary class="text-primary">나무 원본 상세내역</summary>
                                    <dl class="mt-2 mb-0">
                                        <dt>등록 시 연결 플랜</dt><dd th:text="${income.sourcePlanName}"></dd>
                                        <dt>원본 상세내용</dt><dd th:text="${income.sourceDescription}"></dd>
                                        <dt>종목명</dt><dd th:text="${#strings.isEmpty(income.sourceSecurityName) ? '해당 없음' : income.sourceSecurityName}"></dd>
                                        <dt>실거래일 / 거래일자</dt><dd th:text="|${income.incomeDate} / ${income.sourceBookingDate}|"></dd>
                                        <dt>세전 거래금액</dt><dd th:text="|${#numbers.formatInteger(income.sourceGrossAmount, 0, 'COMMA')}원|"></dd>
                                        <dt>수수료 / 세금</dt><dd th:text="|${#numbers.formatInteger(income.sourceFee, 0, 'COMMA')}원 / ${#numbers.formatInteger(income.sourceTax, 0, 'COMMA')}원|"></dd>
                                        <dt>실제 입금액 (수입 반영)</dt><dd th:text="|${#numbers.formatInteger(income.amount, 0, 'COMMA')}원|"></dd>
                                    </dl><p class="text-muted mb-0">원본을 보존합니다. 수정하려면 삭제 후 올바른 파일로 다시 등록하세요.</p>
                                </details></td>
                            <td class="text-muted small text-nowrap"
                                th:text="${income.createDate != null ? #temporals.format(income.createDate, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                            <td>
                                <div class="d-flex justify-content-end gap-2">
                                    <button th:if="${income.importKey == null}" type="button" class="btn btn-sm btn-outline-primary"
                                            data-bs-toggle="modal"
                                            th:attr="data-bs-target='#editModal-' + ${income.id}">수정</button>
                                    <form action="/income/delete" method="post"
                                          onsubmit="return confirm('이 수입 내역을 삭제하시겠습니까?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="id" th:value="${income.id}">
                                        <input type="hidden" name="month" th:value="${selectedMonth}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:each="income : ${incomes}">
    <div th:if="${income.importKey == null}" class="modal fade" th:id="'editModal-' + ${income.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form action="/income/update" method="post" class="income-amount-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="id" th:value="${income.id}">
                    <div class="modal-header">
                        <h5 class="modal-title">수입 내역 수정</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">수입일</label>
                            <input type="date" name="incomeDate" class="form-control"
                                   th:value="${income.incomeDate}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">수입 유형</label>
                            <select name="incomeType" class="form-select" required>
                                <option th:each="type : ${incomeTypes}"
                                        th:value="${type.name()}" th:text="${type.label}"
                                        th:selected="${type == income.incomeType}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">수입금액 (원)</label>
                            <input type="text" name="amount" inputmode="numeric"
                                   class="form-control amount-input" pattern="[0-9,]+"
                                   th:value="${income.amount}" autocomplete="off" required>
                        </div>
                        <div>
                            <label class="form-label">메모</label>
                            <input type="text" name="memo" class="form-control"
                                   th:value="${income.memo}" maxlength="200">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary">수정 저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>
<script src="/js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.income-amount-form').forEach(form => {
        const input = form.querySelector('.amount-input');
        formatNumberInput(input);
        input.addEventListener('input', () => formatNumberInput(input));
        form.addEventListener('submit', () => input.value = input.value.replace(/,/g, ''));
    });
</script>
</body>
</html>
