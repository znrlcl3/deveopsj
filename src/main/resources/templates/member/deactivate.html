<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원 탈퇴 - AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{common/navigation :: sidebar('account')}"></div>

<main class="container py-5" style="margin-left: 280px; max-width: 760px;">
    <div class="card border-danger shadow-sm">
        <div class="card-body p-4">
            <h3 class="fw-bold text-danger mb-3">회원 탈퇴</h3>
            <div class="alert alert-warning">
                계정은 즉시 로그인할 수 없게 됩니다. 자산·지출·거래 데이터는 복구와
                감사 목적으로 삭제하지 않고 보존됩니다.
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" role="alert"
                 th:text="${errorMessage}"></div>

            <form th:action="@{/member/deactivate}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label fw-bold">현재 비밀번호</label>
                    <input type="password" class="form-control" id="currentPassword"
                           name="currentPassword" maxlength="72"
                           autocomplete="current-password" required>
                </div>
                <div class="mb-4">
                    <label for="confirmation" class="form-label fw-bold">
                        확인을 위해 <code>회원탈퇴</code>를 입력하세요
                    </label>
                    <input type="text" class="form-control" id="confirmation"
                           name="confirmation" maxlength="20" autocomplete="off" required>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/member/password}" class="btn btn-outline-secondary">취소</a>
                    <button type="submit" class="btn btn-danger">계정 비활성화</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
