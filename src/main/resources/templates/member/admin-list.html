<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원 관리 - AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{common/navigation :: sidebar('members')}"></div>

<main class="container-fluid py-4" style="margin-left: 280px; width: calc(100% - 280px);">
    <h2 class="fw-bold mb-4">회원 관리</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>아이디</th>
                    <th>이름</th>
                    <th>권한</th>
                    <th>가입일</th>
                    <th>상태</th>
                    <th class="text-end">관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="member : ${members}">
                    <td th:text="${member.loginId}"></td>
                    <td th:text="${member.name}"></td>
                    <td th:text="${member.role}"></td>
                    <td th:text="${member.createDate != null ? #temporals.format(member.createDate, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                    <td>
                        <span th:if="${member.active}" class="badge text-bg-success">활성</span>
                        <span th:unless="${member.active}" class="badge text-bg-secondary">비활성</span>
                    </td>
                    <td class="text-end">
                        <form th:action="@{/admin/members/{id}/status(id=${member.memberId})}"
                              method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="active" th:value="${!member.active}">
                            <button type="submit"
                                    th:class="${member.active} ? 'btn btn-sm btn-outline-danger' : 'btn btn-sm btn-outline-success'"
                                    th:text="${member.active} ? '비활성화' : '활성화'"></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(members)}">
                    <td colspan="6" class="text-center text-muted py-4">등록된 회원이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
