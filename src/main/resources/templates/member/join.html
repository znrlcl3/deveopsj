<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Pretendard', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .join-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .btn-primary {
            background-color: #4e73df;
            border: none;
        }
    </style>
</head>
<body>

<div class="card join-card p-4 bg-white">
    <div class="text-center mb-4">
        <h3 class="fw-bold">회원가입</h3>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger small" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/member/join-proc}" method="post">
        <div class="mb-3">
            <label for="loginId" class="form-label small fw-bold">아이디</label>
            <input type="text" class="form-control" id="loginId" name="loginId" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label small fw-bold">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label small fw-bold">이름</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">가입하기</button>
    </form>
</div>

</body>
</html>
