<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 변경 - AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="~{common/navigation :: sidebar('account')}"></div>

<main class="container py-5" style="margin-left: 280px; max-width: 760px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h3 class="fw-bold mb-4">비밀번호 변경</h3>

            <div th:if="${errorMessage}" class="alert alert-danger" role="alert"
                 th:text="${errorMessage}"></div>

            <form th:action="@{/member/password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label fw-bold">현재 비밀번호</label>
                    <input type="password" class="form-control" id="currentPassword"
                           name="currentPassword" maxlength="72" autocomplete="current-password" required>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label fw-bold">새 비밀번호</label>
                    <input type="password" class="form-control" id="newPassword"
                           name="newPassword" minlength="8" maxlength="72"
                           autocomplete="new-password" required>
                    <div class="form-text">8자 이상 72자 이하로 입력해 주세요.</div>
                </div>
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-bold">새 비밀번호 확인</label>
                    <input type="password" class="form-control" id="confirmPassword"
                           name="confirmPassword" minlength="8" maxlength="72"
                           autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary">변경 후 다시 로그인</button>
            </form>
            <hr class="my-4">
            <a th:href="@{/member/deactivate}" class="btn btn-sm btn-outline-danger">
                회원 탈퇴
            </a>
        </div>
    </div>
</main>
</body>
</html>
