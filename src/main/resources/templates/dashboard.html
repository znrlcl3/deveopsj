<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>AI 자산 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Pretendard', sans-serif; }
        .card { border: none; border-radius: 15px; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .ai-card { background: linear-gradient(135.deg, #667eea 0%, #764ba2 100%); color: black; }
        .progress { height: 30px; border-radius: 15px; font-weight: bold; }
        .analysis-option { cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .analysis-option:hover { transform: translateY(-2px); }
        .analysis-radio:checked + .analysis-option {
            border-color: #4e73df;
            background-color: #eef2ff;
            box-shadow: 0 0 0 3px rgba(78, 115, 223, 0.15);
        }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- 사이드바 삽입 -->
    <div th:replace="~{common/navigation :: sidebar('dashboard')}"></div>

    <!-- 메인 콘텐츠 영역 (사이드바 너비 280px 반영) -->
    <div class="flex-grow-1 py-5 px-4 px-md-5" style="margin-left: 280px; min-height: 100vh;">
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <h2 class="mb-4 fw-bold"><i class="fas fa-wallet text-primary"></i> My Wealth Dashboard</h2>

        <div class="row">
            <div class="col-md-7 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-4">이번 달 투자 달성 현황</h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span>현재 적립액: <strong th:text="${#numbers.formatInteger(summary.totalInvestment, 0, 'COMMA')} + '원'"></strong></span>
                            <span>목표 합계: <strong id="totalTarget">--원</strong></span>
                        </div>
                        <div class="progress mb-4">
                            <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" 
                                 role="progressbar" 
                                 th:style="'width: ' + ${summary.investmentProgress} + '%;'" 
                                 th:text="${#numbers.formatDecimal(summary.investmentProgress, 1, 1)} + '%'">
                            </div>
                        </div>
                        <p class="text-muted small">* 목표 금액 대비 실제 자산 플랜 실행 기준입니다.</p>
                    </div>
                </div>
            </div>

            <div class="col-md-5 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-4">카테고리별 지출</h5>
                        <canvas id="spendingChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card ai-card shadow-lg">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0">
                        <i class="fas fa-robot"></i>
                        <span th:text="${aiModel} + '의 실시간 진단'">Gemini의 실시간 진단</span>
                    </h5>
                </div>
                <hr class="border-light">
                <div class="mb-3">
                    <label for="analysisMonth" class="form-label fw-bold">분석 기간</label>
                    <input id="analysisMonth" type="month" class="form-control"
                           th:value="${analysisMonth}" th:max="${analysisMonth}">
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6" th:each="type, status : ${analysisTypes}">
                        <input class="btn-check analysis-radio" type="radio" name="analysisType"
                               th:id="'analysis-' + ${type.name()}" th:value="${type.name()}"
                               th:checked="${status.first}">
                        <label class="card analysis-option h-100 p-3"
                               th:for="'analysis-' + ${type.name()}">
                            <strong th:text="${type.title}"></strong>
                            <span class="small text-muted mt-1" th:switch="${type.name()}">
                                <span th:case="'SAVING_OPPORTUNITIES'">반복되거나 과도한 소비 후보를 찾아요.</span>
                                <span th:case="'CATEGORY_REVIEW'">카테고리별 비중과 개선점을 평가해요.</span>
                                <span th:case="'MONTHLY_COMPARISON'">선택한 달을 이전 달과 비교해요.</span>
                                <span th:case="'NEXT_MONTH_PLAN'">실행 가능한 다음 달 절약 목표를 만들어요.</span>
                            </span>
                        </label>
                    </div>
                </div>
                <button id="btnAnalyze" class="btn btn-light fw-bold text-primary">
                    <i class="fas fa-magic"></i> 선택한 분석 시작
                </button>
                <div id="aiLoader" class="spinner-border spinner-border-sm text-light d-none ms-2"
                     role="status"></div>
                <div id="aiText" class="alert alert-light mt-3 mb-0">
                    분석 기간과 유형을 선택해 주세요.
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    /* Thymeleaf 데이터를 JS 객체로 변환 */
    const categoryData = [[${summary.spendingByCategory}]];
    
    const ctx = document.getElementById('spendingChart').getContext('2d');
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: Object.keys(categoryData),
            datasets: [{
                data: Object.values(categoryData),
                backgroundColor: ['#4e73df', '#1cc88a', '#36b9cc', '#f6c23e', '#e74a3b'],
                hoverOffset: 4
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });
    
    document.getElementById('btnAnalyze').addEventListener('click', function() {
        const aiTextField = document.getElementById('aiText');
        const loader = document.getElementById('aiLoader');
        const btn = this;

        const month = document.getElementById('analysisMonth').value;
        const analysisType = document.querySelector('input[name="analysisType"]:checked')?.value;
        if (!month || !analysisType) {
            aiTextField.innerText = "분석 기간과 유형을 선택해 주세요.";
            return;
        }

        aiTextField.innerText = "지출 데이터를 정리해 분석 중입니다. 잠시만 기다려주세요...";
        loader.classList.remove('d-none');
        btn.disabled = true;

        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
        fetch('/api/ai/spending-analysis', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify({ month, analysisType })
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('analysis request failed');
                }
                return response.json();
            })
            .then(data => {
                aiTextField.innerText = data.feedback;
                loader.classList.add('d-none');
                btn.disabled = false;
            })
            .catch(error => {
                aiTextField.innerText = "분석 중 오류가 발생했습니다.";
                loader.classList.add('d-none');
                btn.disabled = false;
                console.error('Error:', error);
            });
    });
</script>

</body>
</html>
