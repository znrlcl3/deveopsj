<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="summary(data)" class="card p-4 mb-4">
<h2 class="h5 fw-bold">계좌 자산 현황</h2>
<div class="row g-3"><div class="col-md-4"><span class="small text-muted">계좌 자산 총액</span><strong class="d-block fs-3" th:text="${data.totalAssetsKrw() != null ? #numbers.formatInteger(data.totalAssetsKrw(),0,'COMMA') + '원' : '평가 확인 필요'}"></strong></div>
<div class="col-md-4"><span class="small text-muted">보유종목 매입금액</span><strong class="d-block fs-4" th:text="${data.comparisonCostKrw() != null ? #numbers.formatInteger(data.comparisonCostKrw(),0,'COMMA') + '원' : '매수 환율 없음'}"></strong></div>
<div class="col-md-4"><span class="small text-muted">보유종목 평가손익</span><strong class="d-block fs-4" th:text="${data.comparisonProfitKrw() != null ? #numbers.formatInteger(data.comparisonProfitKrw(),0,'COMMA') + '원' : '평가 확인 필요'}"></strong></div></div>
<p class="small text-muted mt-3">잔고 업로드 계좌는 최신 파일의 자산금액(예수금 포함)을 우선합니다. 해당 계좌의 기존 매매·직접 입력 평가액은 제외합니다. 파일이 없는 계좌만 기존 보유분을 평가하며 그 계좌의 예수금은 포함하지 않습니다. 직접 등록한 현금·예적금은 이 합계에 더하지 않습니다.</p>
<div th:each="account : ${data.snapshots}" class="border-top py-2"><div class="d-flex flex-wrap gap-2 justify-content-between"><span><strong th:text="${account.planName}"></strong><small class="d-block text-muted" th:text="|나무 잔고 기준일 ${account.date} · 실시간 시세 아님|"></small></span><strong th:text="|${#numbers.formatInteger(account.data.total(),0,'COMMA')}원|"></strong></div>
<details class="mt-2"><summary>파일 기준 보유종목·손익 보기</summary><div th:replace="~{portfolio/balance-details :: balanceDetails(${account.data})}"></div></details></div>
<a href="/holdings/import" class="mt-2">잔고 갱신하기</a>
</section></body></html>
