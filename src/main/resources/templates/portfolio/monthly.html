<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>월별 포트폴리오 | AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Pretendard', sans-serif; }
        .content-container { max-width: 1400px; margin: 50px auto; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .summary-value { font-size: 1.5rem; font-weight: 700; }
    </style>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{common/navigation :: sidebar('portfolio')}"></div>
    <main class="flex-grow-1" style="margin-left: 280px; min-height: 100vh;">
        <div class="container content-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1">월별 포트폴리오</h3>
                    <p class="text-muted mb-0">선택한 달의 거래와 월말 기준 보유자산을 확인합니다.</p>
                </div>
                <form method="get" action="/portfolio/monthly" class="d-flex gap-2">
                    <input type="month" name="month" class="form-control"
                           th:value="${summary.selectedMonth}"
                           th:max="${currentMonth}" required>
                    <button type="submit" class="btn btn-primary text-nowrap">조회</button>
                </form>
            </div>

            <ul class="nav nav-pills mb-4">
                <li class="nav-item">
                    <a class="nav-link" href="/portfolio">현재 보유자산</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/portfolio/monthly">월별 포트폴리오</a>
                </li>
            </ul>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card p-4 h-100">
                        <div class="text-muted mb-2">이번 달 매수</div>
                        <div class="summary-value"
                             th:text="${#numbers.formatInteger(summary.monthlyBuyAmountKrw, 0, 'COMMA')} + '원'"></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-4 h-100">
                        <div class="text-muted mb-2">이번 달 매도</div>
                        <div class="summary-value"
                             th:text="${#numbers.formatInteger(summary.monthlySellAmountKrw, 0, 'COMMA')} + '원'"></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-4 h-100">
                        <div class="text-muted mb-2">이번 달 순투자금</div>
                        <div class="summary-value"
                             th:classappend="${summary.monthlyNetInvestmentKrw < 0} ? 'text-primary' : ''"
                             th:text="${#numbers.formatInteger(summary.monthlyNetInvestmentKrw, 0, 'COMMA')} + '원'"></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-4 h-100">
                        <div class="text-muted mb-2">월말 남은 매입원금</div>
                        <div class="summary-value"
                             th:text="${#numbers.formatInteger(summary.monthEndCostKrw, 0, 'COMMA')} + '원'"></div>
                    </div>
                </div>
            </div>

            <div class="alert alert-info">
                월말까지 등록된 거래를 누적하고, 매도 시 이동평균 원가를 차감합니다.
                과거 시세가 연동되기 전까지 월말 평가금액과 수익률은 표시하지 않습니다.
            </div>

            <div class="card p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>플랜/계좌</th>
                            <th>종목</th>
                            <th class="text-end">월말 보유수량</th>
                            <th class="text-end">평균매입가</th>
                            <th class="text-end">남은 매입원금</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(summary.positions)}">
                            <td colspan="5" class="text-center text-muted py-5">
                                선택한 월말 기준 보유 종목이 없습니다.
                            </td>
                        </tr>
                        <tr th:each="position : ${summary.positions}">
                            <td th:text="${position.planName}"></td>
                            <td>
                                <div class="fw-bold" th:text="${position.assetName}"></div>
                                <small class="text-muted"
                                       th:text="${position.market + ':' + position.symbol}"></small>
                            </td>
                            <td class="text-end" th:text="${position.quantity.toPlainString()}"></td>
                            <td class="text-end"
                                th:text="${#numbers.formatDecimal(position.averageUnitPrice, 1, 'COMMA', 0, 'POINT')
                                        + ' ' + position.currency}"></td>
                            <td class="text-end"
                                th:text="${#numbers.formatInteger(position.remainingCostKrw, 0, 'COMMA')} + '원'"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
