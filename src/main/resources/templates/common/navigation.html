<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- 공통 네비게이션 사이드바 Fragment -->
    <div th:fragment="sidebar(activeMenu)" class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 280px; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; box-shadow: 4px 0 10px rgba(0,0,0,0.1);">
        <div class="alert alert-warning py-2 px-2 small"
             sec:authorize="hasRole('PREVIOUS_ADMINISTRATOR')">
            <strong>회원 화면 확인 중</strong>
            <div class="mt-1" sec:authentication="principal.member.name"></div>
            <form th:action="@{/impersonation/exit}" method="post" class="mt-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-dark w-100">관리자로 돌아가기</button>
            </form>
        </div>
        <a href="/dashboard/view" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <i class="fas fa-wallet fs-3 me-2 text-primary"></i>
            <span class="fs-4 fw-bold">AI 자산관리</span>
        </a>
        <hr class="border-secondary">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item mb-2">
                <a href="/dashboard/view" class="nav-link text-white d-flex align-items-center py-2 px-3" 
                   th:classappend="${activeMenu == 'dashboard'} ? 'active bg-primary fw-bold' : 'hover-overlay'">
                    <i class="fas fa-chart-line me-3" style="width: 20px;"></i>
                    대시보드
                </a>
            </li>
            <li class="nav-item mb-2">
                <a href="/cashflow" class="nav-link text-white d-flex align-items-center py-2 px-3"
                   th:classappend="${activeMenu == 'cashflow'} ? 'active bg-primary fw-bold' : 'hover-overlay'">
                    <i class="fas fa-arrow-right-arrow-left me-3" style="width: 20px;"></i>
                    월간 자금 흐름
                </a>
            </li>
            <li class="nav-item mb-2">
                <a href="/income/form" class="nav-link text-white d-flex align-items-center py-2 px-3"
                   th:classappend="${activeMenu == 'income'} ? 'active bg-primary fw-bold' : 'hover-overlay'">
                    <i class="fas fa-coins me-3" style="width: 20px;"></i>
                    수입 관리
                </a>
            </li>
            <li class="nav-item mb-2">
                <a href="/spending/form" class="nav-link text-white d-flex align-items-center py-2 px-3" 
                   th:classappend="${activeMenu == 'spending'} ? 'active bg-primary fw-bold' : 'hover-overlay'">
                    <i class="fas fa-receipt me-3" style="width: 20px;"></i>
                    지출 관리
                </a>
            </li>
            <li class="nav-item mb-2">
                <a href="/assetplan/form" class="nav-link text-white d-flex align-items-center py-2 px-3" 
                   th:classappend="${activeMenu == 'assetplan'} ? 'active bg-primary fw-bold' : 'hover-overlay'">
                    <i class="fas fa-piggy-bank me-3" style="width: 20px;"></i>
                    자산 플랜 설정
                </a>
            </li>
            <li class="nav-item mb-2">
                <a href="/goal/form" class="nav-link text-white d-flex align-items-center py-2 px-3" 
                   th:classappend="${activeMenu == 'goal'} ? 'active bg-primary fw-bold' : 'hover-overlay'">
                    <i class="fas fa-bullseye me-3" style="width: 20px;"></i>
                    목표 관리
                </a>
            </li>
            <li class="nav-item mb-2">
                <a href="/savings/form" class="nav-link text-white d-flex align-items-center py-2 px-3" 
                   th:classappend="${activeMenu == 'savings'} ? 'active bg-primary fw-bold' : 'hover-overlay'">
                    <i class="fas fa-hand-holding-usd me-3" style="width: 20px;"></i>
                    납입 관리
                </a>
            </li>
            <li class="nav-item mb-2">
                <a href="/trades/form" class="nav-link text-white d-flex align-items-center py-2 px-3"
                   th:classappend="${activeMenu == 'trades'} ? 'active bg-primary fw-bold' : 'hover-overlay'">
                    <i class="fas fa-arrow-right-arrow-left me-3" style="width: 20px;"></i>
                    주식·ETF 매매
                </a>
            </li>
            <li class="nav-item mb-2">
                <a href="/portfolio" class="nav-link text-white d-flex align-items-center py-2 px-3"
                   th:classappend="${activeMenu == 'portfolio'} ? 'active bg-primary fw-bold' : 'hover-overlay'">
                    <i class="fas fa-chart-pie me-3" style="width: 20px;"></i>
                    보유자산 수익률
                </a>
            </li>
            <li class="nav-item mb-2" sec:authorize="hasRole('ADMIN')">
                <a href="/krx/test" class="nav-link text-white d-flex align-items-center py-2 px-3"
                   th:classappend="${activeMenu == 'krx'} ? 'active bg-primary fw-bold' : 'hover-overlay'">
                    <i class="fas fa-magnifying-glass-chart me-3" style="width: 20px;"></i>
                    종목정보 테스트
                </a>
            </li>
            <li class="nav-item mb-2" sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/members}"
                   class="nav-link text-white d-flex align-items-center py-2 px-3"
                   th:classappend="${activeMenu == 'members'} ? 'active bg-primary fw-bold' : 'hover-overlay'">
                    <i class="fas fa-users-gear me-3" style="width: 20px;"></i>
                    회원 관리
                </a>
            </li>
        </ul>
        <hr class="border-secondary">
        <div class="d-flex align-items-center text-white text-decoration-none px-2" sec:authorize="isAuthenticated()">
            <i class="fas fa-user-circle fs-4 me-2 text-secondary"></i>
            <span class="fw-bold" sec:authentication="principal.member.name">사용자</span>
            <span class="ms-1">님</span>
        </div>
        <div class="d-flex gap-2 px-2 mt-2" sec:authorize="isAuthenticated()">
            <a th:if="${!#authentication.principal.external}"
               th:href="@{/member/password}" class="btn btn-sm btn-outline-light flex-grow-1">
                비밀번호 변경
            </a>
            <form th:action="@{/member/logout}" method="post" class="flex-grow-1">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-light w-100">로그아웃</button>
            </form>
        </div>
        <div class="d-flex align-items-center text-white text-decoration-none px-2" sec:authorize="!isAuthenticated()">
            <a href="/member/login" class="text-white text-decoration-none">로그인</a>
        </div>

        <style>
            .hover-overlay:hover {
                background-color: rgba(255, 255, 255, 0.1);
                transition: background-color 0.2s ease-in-out;
            }
        </style>
    </div>
</body>
</html>
