<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>납입 내역 | AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Pretendard', sans-serif; }
        .content-container { max-width: 1100px; margin: 60px auto; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{common/navigation :: sidebar('savings')}"></div>
    <main class="flex-grow-1" style="margin-left: 280px; min-height: 100vh;">
        <div class="container content-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">납입 내역</h3>
                <a href="/savings/form" class="btn btn-primary">
                    <i class="fas fa-plus me-1"></i> 새 납입 등록
                </a>
            </div>

            <ul class="nav nav-tabs mb-4">
                <li class="nav-item"><a class="nav-link" href="/savings/form">납입 등록</a></li>
                <li class="nav-item"><a class="nav-link active" href="/savings/list">납입 내역</a></li>
            </ul>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:replace="~{common/excel-export :: controls('/savings/export', ${selectedMonth}, 'savingsExportModal')}"></div>

            <div class="card p-4 mb-4">
                <form action="/savings/list" method="get" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="month" class="form-label fw-bold">조회 월</label>
                        <input id="month" type="month" name="month" class="form-control"
                               th:value="${selectedMonth}" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-outline-primary w-100">조회</button>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <span class="text-muted">월 납입 합계</span>
                        <strong class="fs-4 ms-2"
                                th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + '원'"></strong>
                    </div>
                </form>
            </div>

            <div class="card p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>플랜/계좌</th>
                            <th>납입일</th>
                            <th class="text-end">납입금액</th>
                            <th>메모</th>
                            <th class="text-end">관리</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(savings)}">
                            <td colspan="5" class="text-center text-muted py-5">조회한 월의 납입 내역이 없습니다.</td>
                        </tr>
                        <tr th:each="saving : ${savings}">
                            <td>
                                <span th:if="${saving.assetPlan != null}"
                                      th:text="${#strings.isEmpty(saving.assetPlan.planName)
                                              ? saving.assetPlan.goal.title : saving.assetPlan.planName}"></span>
                                <span th:unless="${saving.assetPlan != null}"
                                      th:text="'기타 추가 납입 / ' + ${saving.goal.title}"></span>
                            </td>
                            <td th:text="${saving.depositDate}"></td>
                            <td class="text-end"
                                th:text="${#numbers.formatInteger(saving.amount, 0, 'COMMA')} + '원'"></td>
                            <td th:text="${saving.memo}"></td>
                            <td>
                                <div class="d-flex justify-content-end gap-2">
                                    <button type="button" class="btn btn-sm btn-outline-primary"
                                            data-bs-toggle="modal"
                                            th:attr="data-bs-target='#editModal-' + ${saving.id}">수정</button>
                                    <form action="/savings/delete" method="post"
                                          onsubmit="return confirm('이 납입 내역을 삭제하시겠습니까?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="id" th:value="${saving.id}">
                                        <input type="hidden" name="month" th:value="${selectedMonth}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:each="saving : ${savings}">
    <div class="modal fade" th:id="'editModal-' + ${saving.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form action="/savings/update" method="post" class="savings-amount-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="id" th:value="${saving.id}">
                    <div class="modal-header">
                        <h5 class="modal-title">납입 내역 수정</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">납입 유형</label>
                            <select name="depositType" class="form-select edit-deposit-type"
                                    onchange="toggleSavingsTarget(this)" required>
                                <option value="PLAN"
                                        th:selected="${saving.depositType == null or saving.depositType.name() == 'PLAN'}">
                                    계획 납입
                                </option>
                                <option value="EXTRA"
                                        th:selected="${saving.depositType != null and saving.depositType.name() == 'EXTRA'}">
                                    기타 추가 납입
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">대상 플랜/계좌</label>
                            <select name="assetPlanId" class="form-select">
                                <option value="">플랜을 선택하세요</option>
                                <option th:each="plan : ${plans}" th:value="${plan.id}"
                                        th:text="${(#strings.isEmpty(plan.planName)
                                                ? @masterCodeService.getCodeName('ASSET_TYPE', plan.assetType) + ' 플랜'
                                                : plan.planName)
                                                + ' · 목표: ' + plan.goal.title
                                                + ' · 월 ' + #numbers.formatInteger(plan.monthlyAmount, 0, 'COMMA') + '원'}"
                                        th:selected="${saving.assetPlan != null and plan.id == saving.assetPlan.id}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">대상 목표</label>
                            <select name="goalId" class="form-select">
                                <option value="">목표를 선택하세요</option>
                                <option th:each="goal : ${goals}" th:value="${goal.id}"
                                        th:text="${goal.title}"
                                        th:selected="${saving.goal != null and goal.id == saving.goal.id}"></option>
                            </select>
                            <div class="form-text">기타 추가 납입을 선택한 경우에 사용합니다.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">납입일</label>
                            <input type="date" name="depositDate" class="form-control"
                                   th:value="${saving.depositDate}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">납입금액</label>
                            <input type="text" name="amount" inputmode="numeric"
                                   class="form-control amount-input" pattern="[0-9,]+"
                                   th:value="${saving.amount}" autocomplete="off" required>
                        </div>
                        <div>
                            <label class="form-label">메모</label>
                            <input type="text" name="memo" class="form-control"
                                   th:value="${saving.memo}" maxlength="200">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary">수정 저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleSavingsTarget(typeSelect) {
        const form = typeSelect.closest('form');
        const planSelect = form.querySelector('select[name="assetPlanId"]');
        const goalSelect = form.querySelector('select[name="goalId"]');
        const extra = typeSelect.value === 'EXTRA';
        planSelect.disabled = extra;
        goalSelect.disabled = !extra;
        planSelect.required = !extra;
        goalSelect.required = extra;
        if (extra) {
            planSelect.value = '';
        } else {
            goalSelect.value = '';
        }
    }
    document.querySelectorAll('.edit-deposit-type').forEach(toggleSavingsTarget);

    function formatAmountInput(input) {
        const digits = input.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
        input.value = digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    document.querySelectorAll('.amount-input').forEach(input => {
        input.addEventListener('input', () => formatAmountInput(input));
        formatAmountInput(input);
    });

    document.querySelectorAll('.savings-amount-form').forEach(form => {
        form.addEventListener('submit', () => {
            const amountInput = form.querySelector('.amount-input');
            amountInput.value = amountInput.value.replace(/,/g, '');
        });
    });
</script>
</body>
</html>
