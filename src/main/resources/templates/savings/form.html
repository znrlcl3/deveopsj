<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>추가 납입·인출 | AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="/css/assets.css" rel="stylesheet">
</head>
<body class="asset-page">
<div class="d-flex">
    <div th:replace="~{common/navigation :: sidebar('assets')}"></div>
    <main class="assets-main">
        <div class="assets-content">
            <header th:replace="~{common/savings-navigation :: header}"></header>
            <nav th:replace="~{common/savings-navigation :: tabs('entry')}"></nav>
            <h2 class="h5 fw-bold mb-4">추가 납입·인출</h2>



            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="card p-4" style="max-width: 720px;">
                <div class="card-body">
                    <p class="text-muted small">
                        계좌에 넣은 돈은 납입, 꺼낸 돈은 인출을 선택하세요. 증권 매매·평가손익은 입력하지 않아도 됩니다. 내 계좌 간 이동은 출발 계좌 인출과 도착 계좌 납입을 함께 기록하세요.
                    </p>
                    <form action="/savings/save" method="post" th:object="${entry}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-4">
                            <label class="form-label fw-bold d-block">기록 대상</label>
                            <div class="form-check form-check-inline">
                                <input id="depositTypePlan" class="form-check-input" type="radio"
                                       th:field="*{depositType}" value="PLAN">
                                <label class="form-check-label" for="depositTypePlan">플랜 계좌</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input id="depositTypeExtra" class="form-check-input" type="radio"
                                       th:field="*{depositType}" value="EXTRA">
                                <label class="form-check-label" for="depositTypeExtra">목표에 직접 기록</label>
                            </div>
                        </div>
                        <p class="small text-muted">시작 원금 기준일 당일까지의 거래는 이미 원금에 포함됩니다. 기준일 다음 날부터 실제 추가 납입·인출만 기록하세요.</p>
                        <small class="text-danger" th:errors="*{depositType}"></small>
                        <div id="planTarget" class="mb-4">
                            <label for="assetPlanId" class="form-label fw-bold">대상 플랜/계좌</label>
                            <select id="assetPlanId" th:field="*{assetPlanId}"
                                    class="form-select form-select-lg border-0 bg-light" required>
                                <option value="">플랜을 선택하세요</option>
                                <option th:each="plan : ${plans}" th:value="${plan.id}"
                                        th:text="${(#strings.isEmpty(plan.planName)
                                                ? @masterCodeService.getCodeName('ASSET_TYPE', plan.assetType) + ' 플랜'
                                                : plan.planName)
                                                + ' · 목표: ' + (plan.goal == null ? '미연결' : plan.goal.title)
                                                + (plan.openingDate == null ? '' : ' · 원금 기준일: ' + plan.openingDate)
                                                + ' · 월 ' + #numbers.formatInteger(plan.monthlyAmount, 0, 'COMMA') + '원'}">
                                </option>
                            </select>
                        </div>
                        <small class="text-danger" th:errors="*{assetPlanId}"></small>
                        <div id="goalTarget" class="mb-4 d-none">
                            <label for="goalId" class="form-label fw-bold">대상 목표</label>
                            <select id="goalId" th:field="*{goalId}"
                                    class="form-select form-select-lg border-0 bg-light">
                                <option value="">목표를 선택하세요</option>
                                <option th:each="goal : ${goals}" th:value="${goal.id}"
                                        th:text="${goal.title}"></option>
                            </select>
                            <div class="form-text">특정 계좌 플랜에 속하지 않는 추가 저축으로 기록됩니다.</div>
                        </div>
                        <small class="text-danger" th:errors="*{goalId}"></small>
                        <small class="text-danger" th:errors="*{targetValid}"></small>
                        <div class="mb-4">
                            <label for="depositDate" class="form-label fw-bold">거래일</label>
                            <input type="date" th:field="*{depositDate}"
                                   class="form-control form-control-lg border-0 bg-light" required>
                            <small class="text-danger" th:errors="*{depositDate}"></small>
                        </div>
                        <div class="mb-4">
                            <fieldset class="mb-3">
                                <legend class="form-label fw-bold">거래 구분</legend>
                                <label class="me-3"><input type="radio" th:field="*{direction}" value="DEPOSIT" required> 납입</label>
                                <label><input type="radio" th:field="*{direction}" value="WITHDRAWAL" required> 인출</label>
                                <small class="text-danger" th:errors="*{direction}"></small>
                            </fieldset>
                            <label for="amount" class="form-label fw-bold">금액 (원)</label>
                            <input type="text" th:field="*{amount}" inputmode="numeric" pattern="[1-9][0-9,]*" maxlength="19"
                                   class="form-control form-control-lg border-0 bg-light"
                                   placeholder="0" autocomplete="off" required>
                            <small class="text-danger" th:errors="*{amount}"></small>
                            <small class="text-danger" th:errors="*{amountNonZero}"></small>
                        </div>
                        <div class="mb-5">
                            <label for="memo" class="form-label fw-bold">메모</label>
                            <input type="text" th:field="*{memo}"
                                   class="form-control form-control-lg border-0 bg-light" maxlength="200">
                            <small class="text-danger" th:errors="*{memo}"></small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            납입·인출 저장
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script>
    const planTarget = document.getElementById('planTarget');
    const goalTarget = document.getElementById('goalTarget');
    const planSelect = document.getElementById('assetPlanId');
    const goalSelect = document.getElementById('goalId');

    function showSelectedTarget() {
        const extra = document.getElementById('depositTypeExtra').checked;
        planTarget.classList.toggle('d-none', extra);
        goalTarget.classList.toggle('d-none', !extra);
        planSelect.disabled = extra;
        goalSelect.disabled = !extra;
        planSelect.required = !extra;
        goalSelect.required = extra;
    }

    document.querySelectorAll('input[name="depositType"]').forEach(radio =>
        radio.addEventListener('change', showSelectedTarget));
    showSelectedTarget();

    const amount = document.getElementById('amount');
    amount.addEventListener('input', () => {
        const digits = amount.value.replace(/,/g, '');
        if (/^\d+$/.test(digits)) {
            amount.value = digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
    });
    amount.form.addEventListener('submit', () => {
        amount.value = amount.value.replace(/,/g, '');
    });
</script>
</body>
</html>
