<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>적립 내역 등록 | AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Pretendard', sans-serif; }
        .form-container { max-width: 550px; margin: 60px auto; }
        .card { border: none; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .btn-save { background: #1cc88a; color: white; border: none; padding: 12px; font-weight: 600; }
        .btn-save:hover { background: #17a673; color: white; }
    </style>
</head>
<body>

<div class="d-flex">
    <div th:replace="~{common/navigation :: sidebar('savings')}"></div>

    <div class="flex-grow-1" style="margin-left: 280px; min-height: 100vh;">
        <div class="container form-container">
            <div class="d-flex align-items-center mb-4">
                <a href="/dashboard/view" class="btn btn-light rounded-circle shadow-sm me-3">
                    <i class="fas fa-chevron-left"></i>
                </a>
                <h3 class="fw-bold mb-0">적립 내역 등록</h3>
            </div>

            <div class="card p-4">
                <div class="card-body">
                    <form action="/savings/save" method="post">
                        <div class="mb-4">
                            <label class="form-label fw-bold small"><i class="fas fa-bullseye me-1"></i> 대상 플랜</label>
                            <select name="assetPlan" class="form-select form-select-lg border-0 bg-light" required>
                                <option value="">플랜을 선택하세요</option>
                                <option th:each="plan : ${plans}" th:value="${plan.id}" th:text="${plan.assetType + ' (' + plan.monthlyAmount + '원)'}"></option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small"><i class="far fa-calendar-alt me-1"></i> 적립 날짜</label>
                            <input type="date" name="depositDate" class="form-control form-control-lg border-0 bg-light" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small"><i class="fas fa-won-sign me-1"></i> 적립 금액</label>
                            <input type="number" name="amount" class="form-control form-control-lg border-0 bg-light" placeholder="0" required>
                        </div>
                        <div class="mb-5">
                            <label class="form-label fw-bold small"><i class="fas fa-pen me-1"></i> 메모</label>
                            <input type="text" name="memo" class="form-control form-control-lg border-0 bg-light">
                        </div>
                        <button type="submit" class="btn btn-save w-100 rounded-pill shadow-sm">
                            <i class="fas fa-check me-2"></i> 적립 완료
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
