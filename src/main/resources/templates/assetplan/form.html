<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>자산 계획 설정 | AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Pretendard', sans-serif; }
        .form-container { max-width: 550px; margin: 60px auto; }
        .card { border: none; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .btn-save { background: #4e73df; color: white; border: none; padding: 12px; font-weight: 600; }
        .btn-save:hover { background: #3757d3; color: white; }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- 사이드바 삽입 -->
    <div th:replace="~{common/navigation :: sidebar('assetplan')}"></div>

    <!-- 메인 콘텐츠 영역 -->
    <div class="flex-grow-1" style="margin-left: 280px; min-height: 100vh;">
        <div class="container form-container">
            <div class="d-flex align-items-center mb-4">
                <a href="/dashboard/view" class="btn btn-light rounded-circle shadow-sm me-3">
                    <i class="fas fa-chevron-left"></i>
                </a>
                <h3 class="fw-bold mb-0">자산 계획 설정</h3>
            </div>
<div class="card p-4">
    <div class="card-body">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <form action="/assetplan/save" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <!-- 폼 내용 그대로 유지 -->
            <div class="mb-4">
                <label class="form-label fw-bold small"><i class="fas fa-bullseye me-1"></i> 관련 목표</label>
                <select name="goalId" class="form-select form-select-lg border-0 bg-light" required>
                    <option value="">목표를 선택하세요</option>
                    <option th:each="goal : ${goals}" th:value="${goal.id}" th:text="${goal.title}"></option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small"><i class="fas fa-tag me-1"></i> 자산 유형</label>
                <select name="assetType" class="form-select form-select-lg border-0 bg-light" required>
                    <option value="">유형을 선택하세요</option>
                    <option th:each="code : ${codeMap['ASSET_TYPE']}" th:value="${code.codeId}" th:text="${code.codeName}"></option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small"><i class="fas fa-won-sign me-1"></i> 월 투자 금액</label>
                <input type="number" name="monthlyAmount" class="form-control form-control-lg border-0 bg-light" placeholder="0" required>
            </div>
            <div class="mb-5">
                <label class="form-label fw-bold small"><i class="fas fa-pen me-1"></i> 메모</label>
                <input type="text" name="memo" class="form-control form-control-lg border-0 bg-light">
            </div>
            <button type="submit" class="btn btn-save w-100 rounded-pill shadow-sm">
                <i class="fas fa-check me-2"></i> 계획 저장
            </button>
        </form>
    </div>
</div>

<div class="card p-4 mt-4">
    <div class="card-body">
        <h5 class="card-title mb-3">현재 설정된 자산 플랜</h5>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>목표</th>
                    <th>자산 유형</th>
                    <th>월 투자액</th>
                    <th>메모</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="plan : ${plans}">
                    <td th:text="${plan.goal.title}"></td>
                    <td th:text="${@masterCodeService.getCodeName('ASSET_TYPE', plan.assetType)}"></td>
                    <td th:text="${#numbers.formatInteger(plan.monthlyAmount, 0, 'COMMA')} + '원'"></td>
                    <td th:text="${plan.memo}"></td>
                    <td>
                        <form action="/assetplan/delete" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="id" th:value="${plan.id}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</div>
</div>
</div>
<!-- 생략: 바디/HTML 끝 부분 -->
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
