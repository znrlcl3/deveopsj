<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>자산 플랜 내역 | AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Pretendard', sans-serif; }
        .content-container { max-width: 1100px; margin: 60px auto; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{common/navigation :: sidebar('assetplan')}"></div>

    <main class="flex-grow-1" style="margin-left: 280px; min-height: 100vh;">
        <div class="container content-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">자산 플랜 내역</h3>
                <a href="/assetplan/form" class="btn btn-primary">
                    <i class="fas fa-plus me-1"></i> 새 플랜 등록
                </a>
            </div>

            <ul class="nav nav-tabs mb-4">
                <li class="nav-item">
                    <a class="nav-link" href="/assetplan/form">플랜 등록</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/assetplan/list">플랜 내역</a>
                </li>
            </ul>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="card p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>플랜 이름</th>
                            <th>목표</th>
                            <th>자산 유형</th>
                            <th class="text-end">월 투자액</th>
                            <th>메모</th>
                            <th class="text-end">관리</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(plans)}">
                            <td colspan="6" class="text-center text-muted py-5">등록된 자산 플랜이 없습니다.</td>
                        </tr>
                        <tr th:each="plan : ${plans}">
                            <td th:text="${#strings.isEmpty(plan.planName) ? plan.goal.title : plan.planName}"></td>
                            <td th:text="${plan.goal.title}"></td>
                            <td th:text="${@masterCodeService.getCodeName('ASSET_TYPE', plan.assetType)}"></td>
                            <td class="text-end"
                                th:text="${#numbers.formatInteger(plan.monthlyAmount, 0, 'COMMA')} + '원'"></td>
                            <td th:text="${plan.memo}"></td>
                            <td>
                                <div class="d-flex justify-content-end gap-2">
                                    <button type="button" class="btn btn-sm btn-outline-primary"
                                            data-bs-toggle="modal"
                                            th:attr="data-bs-target='#editModal-' + ${plan.id}">수정</button>
                                    <form action="/assetplan/delete" method="post"
                                          onsubmit="return confirm('이 자산 플랜을 삭제하시겠습니까?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}">
                                        <input type="hidden" name="id" th:value="${plan.id}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:each="plan : ${plans}">
    <div class="modal fade" th:id="'editModal-' + ${plan.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form action="/assetplan/update" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="id" th:value="${plan.id}">
                    <div class="modal-header">
                        <h5 class="modal-title">자산 플랜 수정</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">플랜 이름</label>
                            <input type="text" name="planName" class="form-control"
                                   th:value="${plan.planName}" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">관련 목표</label>
                            <select name="goalId" class="form-select" required>
                                <option th:each="goal : ${goals}" th:value="${goal.id}"
                                        th:text="${goal.title}"
                                        th:selected="${goal.id == plan.goal.id}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">자산 유형</label>
                            <select name="assetType" class="form-select" required>
                                <option th:each="code : ${codeMap['ASSET_TYPE']}"
                                        th:value="${code.codeId}"
                                        th:text="${code.codeName}"
                                        th:selected="${code.codeId == plan.assetType}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">월 투자 금액</label>
                            <input type="number" name="monthlyAmount" class="form-control"
                                   th:value="${plan.monthlyAmount}" min="1" required>
                        </div>
                        <div>
                            <label class="form-label">메모</label>
                            <input type="text" name="memo" class="form-control"
                                   th:value="${plan.memo}" maxlength="200">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary">수정 저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
