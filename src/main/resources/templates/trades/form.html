<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주식·ETF 매매 | AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Pretendard', sans-serif; }
        .content-container { max-width: 900px; margin: 50px auto; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .asset-search-wrap { position: relative; }
        .asset-search-results { position: absolute; z-index: 20; width: 100%; max-height: 280px; overflow-y: auto; }
    </style>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{common/navigation :: sidebar('trades')}"></div>

    <main class="flex-grow-1" style="margin-left: 280px; min-height: 100vh;">
        <div class="container content-container">
            <h3 class="fw-bold mb-4">주식·ETF 매매 등록</h3>

            <ul class="nav nav-tabs mb-4">
                <li class="nav-item"><a class="nav-link active" href="/trades/form">매매 등록</a></li>
                <li class="nav-item"><a class="nav-link" href="/trades/list">매매 내역</a></li>
            </ul>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="card p-4">
                <div class="card-body">
                    <form action="/trades/save" method="post" class="trade-calculation-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="calculationBasis" value="AMOUNT">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">자산플랜</label>
                                <select name="assetPlanId" class="form-select" required>
                                    <option value="">플랜을 선택하세요</option>
                                    <option th:each="plan : ${plans}" th:value="${plan.id}"
                                            th:text="${(#strings.isEmpty(plan.planName) ? plan.goal.title : plan.planName)
                                                    + ' - ' + @masterCodeService.getCodeName('ASSET_TYPE', plan.assetType)}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">거래 유형</label>
                                <select name="tradeType" class="form-select" required>
                                    <option value="BUY">매수</option>
                                    <option value="SELL">매도</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">거래일</label>
                                <input type="date" name="tradeDate" class="form-control"
                                       th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                            </div>

                            <div class="col-12 asset-search-wrap">
                                <label class="form-label fw-bold">종목 검색</label>
                                <input type="hidden" name="investmentAssetId" required>
                                <input type="search" class="form-control asset-search"
                                       placeholder="종목명 또는 종목코드를 2글자 이상 입력하세요" autocomplete="off" required>
                                <div class="list-group shadow asset-search-results d-none"></div>
                                <div class="form-text selected-asset-info">
                                    먼저 종목정보 테스트 화면에서 국내·미국 종목을 동기화해 주세요.
                                </div>
                                <div class="form-text current-price-info"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">수량</label>
                                <input type="number" name="quantity" class="form-control"
                                       min="0.00000001" step="0.00000001" placeholder="10" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">총 매매금액</label>
                                <input type="number" name="tradeAmount" class="form-control trade-amount"
                                       min="0.0001" step="0.0001" placeholder="235000">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">통화</label>
                                <input type="text" class="form-control asset-currency" value="KRW" readonly>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-bold">적용 환율</label>
                                <input id="exchangeRate" type="number" name="exchangeRate" class="form-control"
                                       min="0.000001" step="0.000001" value="1" required>
                                <div class="form-text">원화 거래는 1을 사용합니다.</div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">체결단가</label>
                                <input type="number" name="unitPrice" class="form-control unit-price"
                                       min="0.0001" step="0.0001" placeholder="23500">
                                <div class="form-text">금액 또는 단가 중 하나를 입력하면 자동 계산됩니다.</div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">수수료(원)</label>
                                <input type="number" name="feeKrw" class="form-control" min="0" value="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">세금(원)</label>
                                <input type="number" name="taxKrw" class="form-control" min="0" value="0" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">메모</label>
                                <input type="text" name="memo" class="form-control" maxlength="200">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-pill mt-4">
                            매매 내역 저장
                        </button>
                    </form>
                </div>
            </div>

            <div class="card p-4 mt-4">
                <div class="card-body">
                    <h5 class="card-title mb-2">수동 평가금액 기록</h5>
                    <p class="text-muted small">
                        시세 API를 지원하지 않는 자산의 현재 평가금액을 기록합니다.
                    </p>
                    <form action="/valuations/save" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-5">
                                <label class="form-label fw-bold">대상 플랜</label>
                                <select name="assetPlanId" class="form-select" required>
                                    <option value="">플랜을 선택하세요</option>
                                    <option th:each="plan : ${plans}" th:value="${plan.id}"
                                            th:text="${#strings.isEmpty(plan.planName) ? plan.goal.title : plan.planName}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">평가 기준일</label>
                                <input type="date" name="valuationDate" class="form-control"
                                       th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">현재 평가금액</label>
                                <input type="number" name="valuationAmount" class="form-control"
                                       min="0" placeholder="0" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-outline-primary w-100 rounded-pill mt-3">
                            평가금액 저장
                        </button>
                    </form>
                </div>
            </div>

            <div class="card p-4 mt-4" th:if="${!valuations.isEmpty()}">
                <div class="card-body">
                    <h5 class="card-title mb-3">수동 평가 이력</h5>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead><tr><th>플랜</th><th>기준일</th><th class="text-end">평가금액</th></tr></thead>
                            <tbody>
                            <tr th:each="valuation : ${valuations}">
                                <td th:text="${#strings.isEmpty(valuation.assetPlan.planName)
                                        ? valuation.assetPlan.goal.title : valuation.assetPlan.planName}"></td>
                                <td th:text="${valuation.valuationDate}"></td>
                                <td class="text-end"
                                    th:text="${#numbers.formatInteger(valuation.valuationAmount, 0, 'COMMA')} + '원'"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>
<script>
    document.querySelectorAll('.asset-search-wrap').forEach(wrap => {
        const searchInput = wrap.querySelector('.asset-search');
        const assetId = wrap.querySelector('[name="investmentAssetId"]');
        const results = wrap.querySelector('.asset-search-results');
        const info = wrap.querySelector('.selected-asset-info');
        const form = wrap.closest('form');
        const currency = form.querySelector('.asset-currency');
        const exchangeRate = form.querySelector('[name="exchangeRate"]');
        const priceInfo = wrap.querySelector('.current-price-info');
        let timer;

        searchInput.addEventListener('input', () => {
            assetId.value = '';
            priceInfo.textContent = '';
            clearTimeout(timer);
            results.replaceChildren();
            results.classList.add('d-none');
            const keyword = searchInput.value.trim();
            if (keyword.length < 2) return;
            timer = setTimeout(async () => {
                try {
                    const response = await fetch('/api/investment-assets/search?keyword='
                        + encodeURIComponent(keyword));
                    if (!response.ok) throw new Error();
                    const assets = await response.json();
                    assets.forEach(asset => {
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.className = 'list-group-item list-group-item-action';
                        button.textContent = `${asset.assetName} (${asset.symbol}) · ${asset.market} · ${asset.assetClass}`;
                        button.addEventListener('click', () => {
                            assetId.value = asset.id;
                            searchInput.value = `${asset.assetName} (${asset.symbol})`;
                            info.textContent = `${asset.market} · ${asset.assetClass} · ${asset.currency}`;
                            currency.value = asset.currency;
                            if (asset.currency === 'KRW') exchangeRate.value = '1';
                            results.classList.add('d-none');
                            loadCurrentPrice(asset.id, priceInfo);
                        });
                        results.appendChild(button);
                    });
                    if (assets.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'list-group-item text-muted';
                        empty.textContent = '검색 결과가 없습니다. 종목 마스터를 먼저 동기화해 주세요.';
                        results.appendChild(empty);
                    }
                    results.classList.remove('d-none');
                } catch (error) {
                    info.textContent = '종목 검색에 실패했습니다. 잠시 후 다시 시도해 주세요.';
                }
            }, 250);
        });
    });

    async function loadCurrentPrice(assetId, target) {
        target.textContent = '현재가 조회 중...';
        try {
            const response = await fetch(`/api/market-prices/${assetId}`);
            if (!response.ok) throw new Error();
            const quote = await response.json();
            const price = Number(quote.currentPrice).toLocaleString('ko-KR', {
                maximumFractionDigits: 4
            });
            const rate = Number(quote.changeRate).toLocaleString('ko-KR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            target.textContent = `현재가 ${price} ${quote.currency} · 전일 대비 ${rate}%`;
            target.className = `form-text current-price-info ${
                Number(quote.changeRate) > 0 ? 'text-danger'
                    : Number(quote.changeRate) < 0 ? 'text-primary' : 'text-muted'
            }`;
        } catch (error) {
            target.textContent = '현재가를 불러오지 못했습니다. KIS 설정 또는 거래소 정보를 확인해 주세요.';
            target.className = 'form-text current-price-info text-warning';
        }
    }

    document.querySelectorAll('.trade-calculation-form').forEach(form => {
        const quantity = form.querySelector('[name="quantity"]');
        const tradeAmount = form.querySelector('[name="tradeAmount"]');
        const unitPrice = form.querySelector('[name="unitPrice"]');
        const calculationBasis = form.querySelector('[name="calculationBasis"]');
        const rounded = value => String(Math.round((value + Number.EPSILON) * 10000) / 10000);
        const calculate = () => {
            const quantityValue = Number(quantity.value);
            if (quantityValue <= 0) return;
            if (calculationBasis.value === 'UNIT_PRICE') {
                const priceValue = Number(unitPrice.value);
                tradeAmount.value = priceValue > 0 ? rounded(quantityValue * priceValue) : '';
            } else {
                const amountValue = Number(tradeAmount.value);
                unitPrice.value = amountValue > 0 ? rounded(amountValue / quantityValue) : '';
            }
        };
        quantity.addEventListener('input', calculate);
        tradeAmount.addEventListener('input', () => {
            calculationBasis.value = 'AMOUNT';
            calculate();
        });
        unitPrice.addEventListener('input', () => {
            calculationBasis.value = 'UNIT_PRICE';
            calculate();
        });
        calculate();
    });
</script>
</body>
</html>
