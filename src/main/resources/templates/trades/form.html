<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주식·ETF 매매 | AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Pretendard', sans-serif; }
        .content-container { max-width: 900px; margin: 50px auto; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{common/navigation :: sidebar('trades')}"></div>

    <main class="flex-grow-1" style="margin-left: 280px; min-height: 100vh;">
        <div class="container content-container">
            <h3 class="fw-bold mb-4">주식·ETF 매매 등록</h3>

            <ul class="nav nav-tabs mb-4">
                <li class="nav-item"><a class="nav-link active" href="/trades/form">매매 등록</a></li>
                <li class="nav-item"><a class="nav-link" href="/trades/list">매매 내역</a></li>
            </ul>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="card p-4">
                <div class="card-body">
                    <form action="/trades/save" method="post" class="trade-calculation-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">자산플랜</label>
                                <select name="assetPlanId" class="form-select" required>
                                    <option value="">플랜을 선택하세요</option>
                                    <option th:each="plan : ${plans}" th:value="${plan.id}"
                                            th:text="${(#strings.isEmpty(plan.planName) ? plan.goal.title : plan.planName)
                                                    + ' - ' + @masterCodeService.getCodeName('ASSET_TYPE', plan.assetType)}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">거래 유형</label>
                                <select name="tradeType" class="form-select" required>
                                    <option value="BUY">매수</option>
                                    <option value="SELL">매도</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">거래일</label>
                                <input type="date" name="tradeDate" class="form-control"
                                       th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-bold">종목코드</label>
                                <input type="text" name="symbol" class="form-control" maxlength="30"
                                       placeholder="예: 123456" required>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label fw-bold">종목명</label>
                                <input type="text" name="assetName" class="form-control" maxlength="100"
                                       placeholder="예: ACE 다우100" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">시장</label>
                                <input type="text" name="market" class="form-control" maxlength="20"
                                       value="KOSPI" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-bold">분류</label>
                                <select name="assetClass" class="form-select" required>
                                    <option value="ETF">ETF</option>
                                    <option value="STOCK">주식</option>
                                    <option value="FUND">펀드</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">수량</label>
                                <input type="number" name="quantity" class="form-control"
                                       min="0.00000001" step="0.00000001" placeholder="10" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">총 매매금액</label>
                                <input type="number" name="tradeAmount" class="form-control trade-amount"
                                       min="0.0001" step="0.0001" placeholder="235000" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">통화</label>
                                <select id="currency" name="currency" class="form-select" required>
                                    <option value="KRW">KRW</option>
                                    <option value="USD">USD</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-bold">적용 환율</label>
                                <input id="exchangeRate" type="number" name="exchangeRate" class="form-control"
                                       min="0.000001" step="0.000001" value="1" required>
                                <div class="form-text">원화 거래는 1을 사용합니다.</div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">자동 계산 체결단가</label>
                                <input type="text" class="form-control calculated-unit-price" readonly>
                                <div class="form-text">총 매매금액 ÷ 수량</div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">수수료(원)</label>
                                <input type="number" name="feeKrw" class="form-control" min="0" value="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">세금(원)</label>
                                <input type="number" name="taxKrw" class="form-control" min="0" value="0" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">메모</label>
                                <input type="text" name="memo" class="form-control" maxlength="200">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-pill mt-4">
                            매매 내역 저장
                        </button>
                    </form>
                </div>
            </div>

            <div class="card p-4 mt-4">
                <div class="card-body">
                    <h5 class="card-title mb-2">수동 평가금액 기록</h5>
                    <p class="text-muted small">
                        시세 API를 지원하지 않는 자산의 현재 평가금액을 기록합니다.
                    </p>
                    <form action="/valuations/save" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-5">
                                <label class="form-label fw-bold">대상 플랜</label>
                                <select name="assetPlanId" class="form-select" required>
                                    <option value="">플랜을 선택하세요</option>
                                    <option th:each="plan : ${plans}" th:value="${plan.id}"
                                            th:text="${#strings.isEmpty(plan.planName) ? plan.goal.title : plan.planName}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">평가 기준일</label>
                                <input type="date" name="valuationDate" class="form-control"
                                       th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">현재 평가금액</label>
                                <input type="number" name="valuationAmount" class="form-control"
                                       min="0" placeholder="0" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-outline-primary w-100 rounded-pill mt-3">
                            평가금액 저장
                        </button>
                    </form>
                </div>
            </div>

            <div class="card p-4 mt-4" th:if="${!valuations.isEmpty()}">
                <div class="card-body">
                    <h5 class="card-title mb-3">수동 평가 이력</h5>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead><tr><th>플랜</th><th>기준일</th><th class="text-end">평가금액</th></tr></thead>
                            <tbody>
                            <tr th:each="valuation : ${valuations}">
                                <td th:text="${#strings.isEmpty(valuation.assetPlan.planName)
                                        ? valuation.assetPlan.goal.title : valuation.assetPlan.planName}"></td>
                                <td th:text="${valuation.valuationDate}"></td>
                                <td class="text-end"
                                    th:text="${#numbers.formatInteger(valuation.valuationAmount, 0, 'COMMA')} + '원'"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>
<script>
    document.querySelectorAll('.trade-calculation-form').forEach(form => {
        const quantity = form.querySelector('[name="quantity"]');
        const tradeAmount = form.querySelector('[name="tradeAmount"]');
        const unitPrice = form.querySelector('.calculated-unit-price');
        const calculate = () => {
            const quantityValue = Number(quantity.value);
            const amountValue = Number(tradeAmount.value);
            unitPrice.value = quantityValue > 0 && amountValue > 0
                ? (amountValue / quantityValue).toLocaleString('ko-KR', {
                    maximumFractionDigits: 4
                })
                : '';
        };
        quantity.addEventListener('input', calculate);
        tradeAmount.addEventListener('input', calculate);
        calculate();
    });
</script>
</body>
</html>
