<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>목표 관리 - AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{common/navigation :: sidebar('goal')}"></div>

    <div class="flex-grow-1 py-5 px-4" style="margin-left: 280px;">
        <h2 class="mb-4 fw-bold">목표 설정</h2>
        
        <!-- 목표 등록 폼 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                <form th:action="@{/goal/save}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">목표명</label>
                            <input type="text" name="title" class="form-control" required maxlength="100" placeholder="예: 1억 모으기">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">목표 금액</label>
                            <input type="number" name="targetAmount" class="form-control" min="1" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">유형</label>
                            <select name="type" class="form-select" onchange="toggleDate(this.value)" required>
                                <option value="PERPETUAL">무제한</option>
                                <option value="TERM">기간 제한</option>
                            </select>
                        </div>
                        <div class="col-md-2" id="dateFields" style="display: none;">
                            <label class="form-label">종료일</label>
                            <input type="date" name="endDate" class="form-control">
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">등록</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- 목표 목록 -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">내 목표 목록</h5>
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>목표명</th>
                            <th>목표 금액</th>
                            <th>유형</th>
                            <th>종료일</th>
                            <th>상태</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="goal : ${goals}">
                            <td th:text="${goal.title}"></td>
                            <td th:text="${#numbers.formatInteger(goal.targetAmount, 0, 'COMMA')} + '원'"></td>
                            <td th:text="${goal.type.name() == 'PERPETUAL' ? '무제한' : '기간 제한'}"></td>
                            <td th:text="${goal.endDate != null ? goal.endDate : '-'}"></td>
                            <td th:text="${goal.status == 'IN_PROGRESS' ? '진행 중' : (goal.status == 'COMPLETED' ? '완료' : '실패')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleDate(value) {
        document.getElementById('dateFields').style.display = (value === 'TERM') ? 'block' : 'none';
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
