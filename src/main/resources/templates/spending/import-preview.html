<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 지출 미리보기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">카드 지출 미리보기</h2>
            <div class="text-muted" th:text="|${preview.cardCompany.label} · ${preview.originalFilename}|"></div>
        </div>
        <a th:href="@{/spending/list}" class="btn btn-outline-secondary">취소</a>
    </div>

    <div class="alert alert-info">날짜·금액·가맹점이 같은 내역과 파일 안의 반복 행은 중복 후보로 표시하고 기본 선택에서 제외했습니다. 별도 거래라면 확인 후 선택해 주세요. 이미 등록된 카드 거래는 다시 등록할 수 없습니다.</div>
    <div class="alert alert-warning" th:if="${preview.notice != null}" th:text="${preview.notice}"></div>
    <div class="alert alert-danger" role="alert" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

    <form id="cardImportConfirmForm" th:action="@{/spending/card-import/confirm}" method="post"
          onsubmit="return confirmCardImportSubmission(this);">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${preview.token}">
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>선택</th><th>원본 행</th><th>날짜</th><th>가맹점</th>
                        <th class="text-end">금액</th><th>카테고리</th><th>상태</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row, stat : ${preview.rows}" th:classappend="${!row.importable()} ? 'table-warning'">
                        <td><input type="checkbox" name="selectedRows" th:value="${stat.index}"
                                   th:checked="${selectedRows == null ? row.selectedByDefault() : #lists.contains(selectedRows, stat.index)}"
                                   th:disabled="${!row.importable()}"></td>
                        <td th:text="${row.sourceLabel()}"></td>
                        <td th:text="${row.spendingDate}"></td>
                        <td th:text="${row.merchantName}"></td>
                        <td class="text-end" th:text="${#numbers.formatInteger(row.amount, 0, 'COMMA')} + '원'"></td>
                        <td>
                            <select th:if="${row.importable()}" class="form-select form-select-sm"
                                    th:name="|category_${stat.index}|">
                                <option value="" th:selected="${selectedCategories == null or selectedCategories[stat.index] == null or selectedCategories[stat.index].isBlank()}">AI 자동 분류</option>
                                <option th:each="code : ${codeMap['SPENDING_CAT']}" th:value="${code.codeId}"
                                        th:text="${code.codeName}"
                                        th:selected="${selectedCategories != null and selectedCategories[stat.index] == code.codeId}"></option>
                            </select>
                            <span th:unless="${row.importable()}" class="text-muted">-</span>
                        </td>
                        <td>
                            <span th:if="${row.alreadyImported}" class="badge text-bg-secondary">이미 등록된 카드 거래</span>
                            <span th:if="${row.duplicateInFile}" class="badge text-bg-warning">파일 안의 반복 행</span>
                            <div th:each="match : ${row.matches}" class="small">
                                <span th:text="|기존 #${match.id} · ${@masterCodeService.getCodeName('SPENDING_CAT', match.categoryCode)}|"></span>
                                <span th:text="${match.createDate != null ? ' · 등록 ' + #temporals.format(match.createDate, 'yyyy-MM-dd HH:mm') : ' · 등록 일시 없음'}"></span>
                            </div>
                            <span th:if="${row.importable() and !row.duplicateCandidate()}" class="badge text-bg-success">새 내역</span>
                            <span th:if="${row.errorMessage != null}" class="text-warning" th:text="${row.errorMessage}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer d-flex justify-content-end gap-2 p-3">
                <a th:href="@{/spending/list}" class="btn btn-outline-secondary">취소</a>
                <button id="cardImportSubmitButton" type="submit" class="btn btn-primary">선택 내역 등록</button>
            </div>
        </div>
    </form>
</main>
<script>
function confirmCardImportSubmission(form) {
    const selectedCount = form.querySelectorAll('input[name="selectedRows"]:checked:not(:disabled)').length;
    if (selectedCount === 0) {
        window.alert('등록할 내역을 한 건 이상 선택해 주세요.');
        return false;
    }
    if (!window.confirm(`선택한 ${selectedCount}건을 등록하시겠습니까?`)) {
        return false;
    }
    const submitButton = document.getElementById('cardImportSubmitButton');
    submitButton.disabled = true;
    submitButton.textContent = '등록 중...';
    return true;
}
</script>
</body>
</html>
