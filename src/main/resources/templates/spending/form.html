<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>지출 내역 등록 | AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .btn-save { background: #e74a3b; color: white; border: none; padding: 12px; font-weight: 600; }
        .btn-save:hover { background: #c0392b; color: white; }
        .ai-badge { background: #f8f9fc; border: 1px dashed #4e73df; color: #4e73df; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; }
    </style>
    <link rel="stylesheet" href="/css/ledger-layout.css">
</head>
<body class="ledger-page">

<div class="d-flex">
    <!-- 사이드바 삽입 -->
    <div th:replace="~{common/navigation :: sidebar('spending')}"></div>

    <!-- 메인 콘텐츠 영역 (사이드바 너비 280px 반영) -->
    <main class="ledger-main">
        <div class="ledger-content">
            <header th:replace="~{common/ledger-navigation :: spending('form')}"></header>

            <div class="card p-4 ledger-form-card">
                <div class="card-body">
                    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                    <form id="spendingForm" onsubmit="submitForm(event)">
                        <div class="mb-4">
                            <label class="form-label fw-bold small"><i class="far fa-calendar-alt me-1"></i> 날짜</label>
                            <input type="date" id="spendingDate" class="form-control form-control-lg border-0 bg-light" required
                                   th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold small"><i class="fas fa-won-sign me-1"></i> 금액</label>
                            <input type="number" id="amount" class="form-control form-control-lg border-0 bg-light" min="1" required placeholder="0">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold small">
                                <i class="fas fa-pen me-1"></i> 지출 메모
                                <span class="ai-badge ms-2"><i class="fas fa-robot"></i> AI 분석 데이터</span>
                            </label>
                            <input type="text" id="memo" class="form-control form-control-lg border-0 bg-light" required maxlength="200" placeholder="예: 스타벅스 아이스 아메리카노">
                        </div>

                        <div class="mb-5">
                            <label class="form-label fw-bold small"><i class="fas fa-th-large me-1"></i> 카테고리</label>
                            <select id="categoryCode" class="form-select">
                                <option value="">선택하세요</option>
                                <option th:each="code : ${codeMap['SPENDING_CAT']}" th:value="${code.codeId}"   th:text="${code.codeName}">
                                </option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-save w-100 rounded-pill shadow-sm">
                            <i class="fas fa-check me-2"></i> 저장하기
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </main>
</div>
<script src="/js/common.js"></script>
<script>
function submitForm(event) {
    event.preventDefault();
    const btn = event.currentTarget.querySelector('button[type=submit]');
    const originalText = btn.innerHTML;
    
    const formData = {
        date: document.getElementById('spendingDate').value,
        amount: document.getElementById('amount').value,
        memo: document.getElementById('memo').value,
        category: document.getElementById('categoryCode').value
    };
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    if (!formData.amount || !formData.memo) {
        alert("금액과 메모를 입력해 주세요!");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> AI가 분석 중...';

   	fetch('/spending/api/save', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            [csrfHeader]: csrfToken
        },
        body: JSON.stringify(formData)
    })
    .then(res => res.ok ? res.text() : Promise.reject())
    .then(() => {
        location.href = "/spending/list?month=" + encodeURIComponent(formData.date.slice(0, 7));
    })
    .catch(err => {
        alert("저장 중 오류가 발생했습니다.");
        btn.disabled = false;
        btn.innerHTML = originalText;
    });
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
