<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지출 엑셀 미리보기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <h2>지출 엑셀 미리보기</h2>
    <p class="text-muted" th:text="${preview.originalFilename}"></p>
    <div class="alert alert-info">날짜·금액·메모가 같은 기존 내역은 중복 후보입니다. 중복 후보와 파일 안의 반복 행은 기본 선택에서 제외했습니다. 실제로 별도 지출인 경우 확인 후 선택해 주세요. 이미 등록한 동일 파일의 행은 다시 등록할 수 없습니다.</div>
    <div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>
    <form th:action="@{/spending/import/confirm}" method="post" onsubmit="return confirmExcelImport(this);">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${preview.token}">
        <div class="table-responsive card">
            <table class="table align-middle mb-0">
                <thead><tr><th>선택</th><th>원본 행</th><th>날짜</th><th>카테고리</th><th class="text-end">금액</th><th>메모</th><th>중복 확인</th></tr></thead>
                <tbody>
                <tr th:each="row, stat : ${preview.rows}" th:classappend="${row.duplicateCandidate() or row.alreadyImported} ? 'table-warning'">
                    <td><input type="checkbox" name="selectedRows" th:value="${stat.index}"
                               th:checked="${selectedRows == null ? row.selectedByDefault() : #lists.contains(selectedRows, stat.index)}"
                               th:disabled="${row.alreadyImported}"></td>
                    <td th:text="${row.sourceRow}"></td>
                    <td th:text="${row.spendingDate}"></td>
                    <td th:text="${@masterCodeService.getCodeName('SPENDING_CAT', row.categoryCode)}"></td>
                    <td class="text-end" th:text="${#numbers.formatInteger(row.amount, 0, 'COMMA')} + '원'"></td>
                    <td th:text="${row.memo}"></td>
                    <td>
                        <span th:if="${row.alreadyImported}" class="badge text-bg-secondary">동일 파일에서 이미 등록</span>
                        <span th:if="${row.duplicateInFile}" class="badge text-bg-warning">파일 안의 반복 행</span>
                        <div th:each="match : ${row.matches}" class="small">
                            <span th:text="|기존 #${match.id} · ${@masterCodeService.getCodeName('SPENDING_CAT', match.categoryCode)}|"></span>
                            <span th:text="${match.createDate != null ? ' · 등록 ' + #temporals.format(match.createDate, 'yyyy-MM-dd HH:mm') : ' · 등록 일시 없음'}"></span>
                        </div>
                        <span th:if="${!row.alreadyImported and !row.duplicateCandidate()}" class="badge text-bg-success">새 내역</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-3">
            <a th:href="@{/spending/list(month=${preview.month})}" class="btn btn-outline-secondary">취소</a>
            <button type="submit" class="btn btn-primary">선택 내역 등록</button>
        </div>
    </form>
</main>
<script>
function confirmExcelImport(form) {
    const count = form.querySelectorAll('input[name="selectedRows"]:checked:not(:disabled)').length;
    if (!count) { window.alert('등록할 행을 선택해 주세요.'); return false; }
    if (!window.confirm('선택한 ' + count + '건을 등록하시겠습니까?')) return false;
    form.querySelector('button[type="submit"]').disabled = true;
    return true;
}
</script>
</body>
</html>
