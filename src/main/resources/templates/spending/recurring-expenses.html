<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>고정지출 관리 | AI 자산관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Pretendard', sans-serif; }
        .content-container { max-width: 1100px; margin: 60px auto; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    </style>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{common/navigation :: sidebar('spending')}"></div>
    <main class="flex-grow-1" style="margin-left: 280px; min-height: 100vh;">
        <div class="container content-container">
            <h3 class="fw-bold mb-4">고정지출 관리</h3>
            <ul class="nav nav-tabs mb-4">
                <li class="nav-item"><a class="nav-link" th:href="@{/spending/form}">지출 등록</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/spending/list}">지출 내역</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/recurring-expenses}">고정지출 설정</a></li>
            </ul>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="card p-4 mb-4">
                <h5 class="fw-bold mb-3">새 고정지출</h5>
                <form th:action="@{/recurring-expenses}" method="post" class="row g-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="col-md-4">
                        <label class="form-label">이름</label>
                        <input name="name" class="form-control" maxlength="100" required placeholder="예: 월세">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">카테고리</label>
                        <select name="category" class="form-select" required>
                            <option value="">선택</option>
                            <option th:each="code : ${codeMap['SPENDING_CAT']}"
                                    th:value="${code.codeId}" th:text="${code.codeName}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">금액</label>
                        <input name="amount" type="number" class="form-control" min="1" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">매월 결제일</label>
                        <input name="paymentDay" type="number" class="form-control" min="1" max="31" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">적용 시작일</label>
                        <input name="startDate" type="date" class="form-control" required
                               th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">적용 종료일 (선택)</label>
                        <input name="endDate" type="date" class="form-control">
                        <div class="btn-group btn-group-sm mt-2 duration-buttons" role="group" aria-label="적용 기간 빠른 설정">
                            <button type="button" class="btn btn-outline-secondary" data-years="1">1년</button>
                            <button type="button" class="btn btn-outline-secondary" data-years="2">2년</button>
                            <button type="button" class="btn btn-outline-secondary" data-years="3">3년</button>
                            <button type="button" class="btn btn-outline-secondary" data-years="unlimited">무기한</button>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">메모 (선택)</label>
                        <input name="memo" class="form-control" maxlength="200">
                    </div>
                    <div class="col-12 text-end">
                        <button class="btn btn-primary" type="submit">고정지출 저장</button>
                    </div>
                </form>
            </div>

            <div class="card p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead><tr><th>이름</th><th>분류</th><th class="text-end">금액</th><th>결제일</th><th>적용 기간</th><th>상태</th><th class="text-end">관리</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(rules)}"><td colspan="7" class="text-center text-muted py-5">등록된 고정지출이 없습니다.</td></tr>
                        <tr th:each="rule : ${rules}">
                            <td th:text="${rule.name}"></td>
                            <td th:text="${@masterCodeService.getCodeName('SPENDING_CAT', rule.categoryCode)}"></td>
                            <td class="text-end" th:text="${#numbers.formatInteger(rule.amount, 0, 'COMMA')} + '원'"></td>
                            <td th:text="'매월 ' + ${rule.paymentDay} + '일'"></td>
                            <td><span th:text="${rule.startDate}"></span><span th:if="${rule.endDate != null}" th:text="' ~ ' + ${rule.endDate}"></span></td>
                            <td><span class="badge" th:classappend="${rule.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${rule.active} ? '사용 중' : '중지'"></span></td>
                            <td>
                                <div class="d-flex justify-content-end gap-2">
                                    <button class="btn btn-sm btn-outline-primary" type="button" data-bs-toggle="modal" th:attr="data-bs-target='#edit-' + ${rule.id}">수정</button>
                                    <form th:action="@{/recurring-expenses/toggle}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="id" th:value="${rule.id}">
                                        <button class="btn btn-sm btn-outline-secondary" type="submit" th:text="${rule.active} ? '중지' : '재개'"></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:each="rule : ${rules}">
    <div class="modal fade" th:id="'edit-' + ${rule.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog"><div class="modal-content">
            <form th:action="@{/recurring-expenses/update}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="id" th:value="${rule.id}">
                <div class="modal-header"><h5 class="modal-title">고정지출 수정</h5><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">이름</label><input name="name" class="form-control" th:value="${rule.name}" maxlength="100" required></div>
                    <div class="mb-3"><label class="form-label">카테고리</label><select name="category" class="form-select" required><option th:each="code : ${codeMap['SPENDING_CAT']}" th:value="${code.codeId}" th:text="${code.codeName}" th:selected="${code.codeId == rule.categoryCode}"></option></select></div>
                    <div class="mb-3"><label class="form-label">금액</label><input name="amount" type="number" class="form-control" th:value="${rule.amount}" min="1" required></div>
                    <div class="mb-3"><label class="form-label">결제일</label><input name="paymentDay" type="number" class="form-control" th:value="${rule.paymentDay}" min="1" max="31" required></div>
                    <div class="mb-3"><label class="form-label">시작일</label><input name="startDate" type="date" class="form-control" th:value="${rule.startDate}" required></div>
                    <div class="mb-3">
                        <label class="form-label">종료일</label>
                        <input name="endDate" type="date" class="form-control" th:value="${rule.endDate}">
                        <div class="btn-group btn-group-sm mt-2 duration-buttons" role="group" aria-label="적용 기간 빠른 설정">
                            <button type="button" class="btn btn-outline-secondary" data-years="1">1년</button>
                            <button type="button" class="btn btn-outline-secondary" data-years="2">2년</button>
                            <button type="button" class="btn btn-outline-secondary" data-years="3">3년</button>
                            <button type="button" class="btn btn-outline-secondary" data-years="unlimited">무기한</button>
                        </div>
                    </div>
                    <div><label class="form-label">메모</label><input name="memo" class="form-control" th:value="${rule.memo}" maxlength="200"></div>
                </div>
                <div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="mod추l">취소</button><button class="btn btn-primary" type="submit">저장</button></div>
            </form>
        </div></div>
    </div>
</th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll('.duration-buttons button').forEach(button => {
    button.addEventListener('click', () => {
        const form = button.closest('form');
        const startInput = form.querySelector('input[name="startDate"]');
        const endInput = form.querySelector('input[name="endDate"]');

        if (button.dataset.years === 'unlimited') {
            endInput.value = '';
            return;
        }
        if (!startInput.value) {
            alert('적용 시작일을 먼저 선택해 주세요.');
            startInput.focus();
            return;
        }

        const [year, month, day] = startInput.value.split('-').map(Number);
        const endDate = new Date(year + Number(button.dataset.years), month - 1, day);
        endDate.setDate(endDate.getDate() - 1);
        const yyyy = endDate.getFullYear();
        const mm = String(endDate.getMonth() + 1).padStart(2, '0');
        const dd = String(endDate.getDate()).padStart(2, '0');
        endInput.value = `${yyyy}-${mm}-${dd}`;
    });
});
</script>
</body>
</html>
