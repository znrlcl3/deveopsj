# Local application + shared cloud MySQL through an SSH tunnel.
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${CLOUD_DB_LOCAL_PORT:13306}/${CLOUD_DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${CLOUD_DB_USERNAME}
    password: ${CLOUD_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never

server:
  address: 127.0.0.1
  port: ${CLOUD_DEV_PORT:8080}
  servlet:
    session:
      cookie:
        secure: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
